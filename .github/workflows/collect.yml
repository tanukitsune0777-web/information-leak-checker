
name: Collect information-leak news candidates

on:
  schedule:
    - cron: "23 22,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect news candidates
        run: python scripts/collect.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update news candidates"
            git push
          fi
